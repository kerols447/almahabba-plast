    <!-- PAGE HERO (shared compact banner pattern) -->
    <section class="relative overflow-hidden bg-gradient-to-bl from-navy to-primary text-white">
      <div class="absolute inset-0 pointer-events-none dot-grid" aria-hidden="true">
        <span class="pellet pellet-float absolute w-12 h-12 bg-accent/50 top-10 end-[14%]"></span>

            <p class="text-muted text-sm leading-relaxed" data-i18n="quality.c2.d"></p>
          </div>
          <div class="card card-hover p-8 reveal" data-reveal-delay="160">
            <span class="w-12 h-12 rounded-2xl bg-primary text-white flex items-center justify-center mb-5"><i data-lucide="factory" class="w-6 h-6"></i></span>

          </div>
          <div class="card card-hover p-8 reveal" data-reveal-delay="320">

            <p class="text-muted text-sm leading-relaxed" data-i18n="quality.c5.d"></p>
