<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ================= SEO =================
       [PLACEHOLDER] Replace the domain before deployment (Stage 5). -->
  <title>الألوان الخاصة | المحبة بلاست — أي لون خلال 24–48 ساعة</title>
  <meta name="description" content="أرسل عينة أو كود اللون وسنطوّره ونطابقه ونعتمد معك العينة ثم ننتجه خلال 24–48 ساعة. اطلب لونك الخاص الآن من المحبة بلاست.">
  <link rel="canonical" href="https://www.almahabba-plast.com/custom-colors.html">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Al Mahabba Plast — المحبة بلاست">
  <meta property="og:locale" content="ar_EG">
  <meta property="og:title" content="الألوان الخاصة | المحبة بلاست">
  <meta property="og:description" content="أي لون تطلبه… نصنّعه خلال 24 – 48 ساعة. أرسل العينة أو الكود وابدأ المطابقة.">
  <meta property="og:url" content="https://www.almahabba-plast.com/custom-colors.html">
  <meta property="og:image" content="https://www.almahabba-plast.com/assets/img/studio-hero.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='18' cy='20' r='13' fill='%230B3C7A'/%3E%3Ccircle cx='31' cy='17' r='10' fill='%23FF7A1A'/%3E%3Ccircle cx='27' cy='31' r='9' fill='%2316A34A'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>

<body data-page="colors"
      data-title-ar="الألوان الخاصة | المحبة بلاست — أي لون خلال 24–48 ساعة"
      data-title-en="Custom Colors | Al Mahabba Plast — Any Color in 24–48 Hours"
      class="font-cairo bg-white">

  <div id="site-header-mount"></div>

  <main id="main-content">

    <!-- ============================================================
         PAGE HERO — the key differentiator, with color swatch row
         ============================================================ -->
    <section class="relative overflow-hidden bg-gradient-to-bl from-navy via-primary-800 to-primary text-white">
      <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
        <span class="pellet pellet-float absolute w-14 h-14 bg-accent/60 top-16 end-[10%]"></span>
        <span class="pellet pellet-float absolute w-9 h-9 bg-green-400/50 bottom-16 start-[7%]" style="animation-delay:1s"></span>
        <span class="pellet pellet-float absolute w-6 h-6 bg-sky-400/50 bottom-24 end-[22%]" style="animation-delay:2s"></span>
      </div>
      <div class="relative max-w-content mx-auto px-4 sm:px-6 py-20 lg:py-28 text-center">
        <p class="text-accent font-extrabold tracking-wide mb-4" data-i18n="colors.hero.kicker"></p>
        <h1 class="text-3xl sm:text-4xl lg:text-[52px] font-black mb-6 leading-snug max-w-3xl mx-auto" data-i18n="colors.hero.title"></h1>
        <p class="text-gray-200 max-w-2xl mx-auto mb-8 leading-relaxed" data-i18n="colors.hero.subtitle"></p>

        <!-- color swatches: the promise in one line -->
        <div class="flex justify-center items-center gap-2.5 mb-10" aria-hidden="true">
          <span class="pellet w-8 h-8 bg-[#D63031]"></span>
          <span class="pellet w-8 h-8 bg-[#E6B800]"></span>
          <span class="pellet w-8 h-8 bg-[#3FAE29]"></span>
          <span class="pellet w-8 h-8 bg-[#1E5FA8]"></span>
          <span class="pellet w-8 h-8 bg-[#7B4FBF]"></span>
          <span class="pellet w-8 h-8 bg-[#FF7A1A]"></span>
          <span class="pellet w-8 h-8 bg-[#1F2937]"></span>
          <span class="pellet w-8 h-8 bg-[#E8EDF3] border border-white/40"></span>
        </div>

        <div class="flex flex-wrap gap-4 justify-center">
          <a href="#color-form" class="btn btn-accent">
            <i data-lucide="brush" class="w-5 h-5"></i><span data-i18n="cta.orderColorNow"></span>
          </a>
          <a href="#color-process" class="btn btn-outline-light">
            <i data-lucide="list-checks" class="w-5 h-5"></i><span data-i18n="colors.process.title"></span>
          </a>
        </div>
      </div>
    </section>

    <!-- ============================================================
         DETAILED PROCESS — 4 steps, alternating layout
         ============================================================ -->
    <section id="color-process" class="section-pad bg-white">
      <div class="max-w-content mx-auto px-4 sm:px-6">
        <div class="text-center max-w-2xl mx-auto mb-16 reveal">
          <h2 class="text-3xl sm:text-4xl font-black text-navy mb-4" data-i18n="colors.process.title"></h2>
          <p class="text-muted leading-relaxed" data-i18n="colors.process.subtitle"></p>
        </div>

        <ol class="space-y-8 max-w-4xl mx-auto list-none">
          <!-- Step 1 -->
          <li class="card p-7 sm:p-9 flex items-start gap-6 reveal">
            <span class="w-14 h-14 rounded-2xl bg-accent text-white text-2xl font-black flex items-center justify-center shrink-0">1</span>
            <div>
              <h3 class="text-xl font-extrabold text-navy mb-2" data-i18n="colors.step1"></h3>
              <p class="text-muted leading-relaxed" data-i18n="colors.step1.d"></p>
            </div>
          </li>
          <!-- Step 2 -->
          <li class="card p-7 sm:p-9 flex items-start gap-6 reveal" data-reveal-delay="100">
            <span class="w-14 h-14 rounded-2xl bg-primary text-white text-2xl font-black flex items-center justify-center shrink-0">2</span>
            <div>
              <h3 class="text-xl font-extrabold text-navy mb-2" data-i18n="colors.step2"></h3>
              <p class="text-muted leading-relaxed" data-i18n="colors.step2.d"></p>
            </div>
          </li>
          <!-- Step 3 -->
          <li class="card p-7 sm:p-9 flex items-start gap-6 reveal" data-reveal-delay="200">
            <span class="w-14 h-14 rounded-2xl bg-accent text-white text-2xl font-black flex items-center justify-center shrink-0">3</span>
            <div>
              <h3 class="text-xl font-extrabold text-navy mb-2" data-i18n="colors.step3"></h3>
              <p class="text-muted leading-relaxed" data-i18n="colors.step3.d"></p>
            </div>
          </li>
          <!-- Step 4 -->
          <li class="card p-7 sm:p-9 flex items-start gap-6 reveal" data-reveal-delay="300">
            <span class="w-14 h-14 rounded-2xl bg-primary text-white text-2xl font-black flex items-center justify-center shrink-0">4</span>
            <div>
              <h3 class="text-xl font-extrabold text-navy mb-2" data-i18n="colors.step4"></h3>
              <p class="text-muted leading-relaxed" data-i18n="colors.step4.d"></p>
            </div>
          </li>
        </ol>
      </div>
    </section>

    <!-- ============================================================
         COLOR REQUEST FORM — full quote fields + sample image
         ============================================================ -->
    <section id="color-form" class="section-pad bg-surface">
      <div class="max-w-content mx-auto px-4 sm:px-6 grid lg:grid-cols-5 gap-10 items-start">

        <!-- Intro column -->
        <div class="lg:col-span-2 reveal">
          <h2 class="text-3xl font-black text-navy mb-4 leading-snug" data-i18n="colors.form.title"></h2>
          <p class="text-muted leading-relaxed mb-8" data-i18n="colors.form.subtitle"></p>

          <!-- illustrative studio render of the color-matching lab -->
          <div class="card overflow-hidden aspect-[4/3]">
            <img src="assets/img/studio-lab.jpg" alt="معمل مطابقة الألوان وعينات الماستر باتش — صورة توضيحية" loading="lazy" decoding="async"
                 class="w-full h-full object-cover" width="1536" height="1024">
          </div>

          <div class="card p-6 mt-6 flex items-center gap-4">
            <span class="w-12 h-12 rounded-2xl bg-accent-50 text-accent flex items-center justify-center shrink-0"><i data-lucide="timer" class="w-6 h-6"></i></span>
            <p class="font-bold text-navy"><span data-count-to="48">0</span> <span data-i18n="hl.color"></span></p>
          </div>
        </div>

        <!-- Form column -->
        <div class="lg:col-span-3 card p-7 sm:p-9 reveal" data-reveal-delay="120">
          <form data-mp-form novalidate>
            <div class="form-alert mb-6" data-form-alert></div>

            <!-- honeypot anti-spam -->
            <div class="hp-field" aria-hidden="true">
              <label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
            </div>

            <input type="hidden" name="request_type" value="custom-color">

            <div class="grid sm:grid-cols-2 gap-5">
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="cf-name"><span data-i18n="form.name"></span> <span class="text-red-500">*</span></label>
                <input id="cf-name" name="name" class="field" required data-i18n-placeholder="form.name">
              </div>
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="cf-company"><span data-i18n="form.company"></span> <span class="text-red-500">*</span></label>
                <input id="cf-company" name="company" class="field" required data-i18n-placeholder="form.company">
              </div>
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="cf-phone"><span data-i18n="form.phone"></span> <span class="text-red-500">*</span></label>
                <input id="cf-phone" name="phone" class="field" required data-rule="phone" dir="ltr" inputmode="tel" placeholder="+20 1xx xxx xxxx">
              </div>
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="cf-email"><span data-i18n="form.email"></span> <span class="text-red-500">*</span></label>
                <input id="cf-email" name="email" type="email" class="field" required data-rule="email" dir="ltr" inputmode="email" placeholder="name@company.com">
              </div>
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="cf-type"><span data-i18n="form.productType"></span> <span class="text-red-500">*</span></label>
                <select id="cf-type" name="product_type" class="field" required>
                  <option value="" data-i18n="form.productType.choose"></option>
                  <option value="masterbatch" data-i18n="products.masterbatch"></option>
                  <option value="pet-colors" data-i18n="products.pet"></option>
                  <option value="raw-materials" data-i18n="products.raw"></option>
                </select>
              </div>
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="cf-color"><span data-i18n="form.color"></span> <span class="text-red-500">*</span></label>
                <input id="cf-color" name="color_code" class="field" required data-i18n-placeholder="form.color">
              </div>
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="cf-material"><span data-i18n="form.material"></span></label>
                <input id="cf-material" name="material" class="field" data-i18n-placeholder="form.material">
              </div>
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="cf-qty"><span data-i18n="form.quantity"></span></label>
                <input id="cf-qty" name="monthly_quantity" class="field" data-i18n-placeholder="form.quantity">
              </div>
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="cf-delivery"><span data-i18n="form.delivery"></span></label>
                <input id="cf-delivery" name="delivery_location" class="field" data-i18n-placeholder="form.delivery">
              </div>
              <div>
                <label class="block font-bold mb-1.5 text-navy" for="cf-image">
                  <span data-i18n="form.image"></span>
                  <span class="text-muted font-normal text-xs">(<span data-i18n="form.optional"></span>)</span>
                </label>
                <input id="cf-image" name="sample_image" type="file" accept="image/png,image/jpeg"
                       class="field py-2.5 file:ml-0 file:mr-3 file:px-4 file:py-1.5 file:rounded-full file:border-0 file:bg-primary-50 file:text-primary file:font-bold cursor-pointer">
                <p class="text-xs text-muted mt-1.5" data-i18n="colors.upload.help"></p>
              </div>
            </div>

            <div class="mt-5">
              <label class="block font-bold mb-1.5 text-navy" for="cf-notes"><span data-i18n="form.notes"></span></label>
              <textarea id="cf-notes" name="notes" rows="4" class="field" data-i18n-placeholder="form.notes"></textarea>
            </div>

            <button type="submit" class="btn btn-accent w-full sm:w-auto mt-7">
              <i data-lucide="send" class="w-5 h-5"></i>
              <span data-btn-label data-i18n="cta.send"></span>
            </button>
          </form>
        </div>
      </div>
    </section>

    <!-- ============================================================
         FAQ ACCORDION
         ============================================================ -->
    <section class="section-pad bg-white">
      <div class="max-w-3xl mx-auto px-4 sm:px-6">
        <h2 class="text-3xl sm:text-4xl font-black text-navy text-center mb-12 reveal" data-i18n="colors.faq.title"></h2>

        <div data-accordion class="space-y-4">
          <div class="card">
            <button type="button" class="accordion-trigger w-full flex items-center justify-between gap-4 p-6 text-start font-extrabold text-navy" aria-expanded="false">
              <span data-i18n="faq.q1"></span><i data-lucide="chevron-down" class="accordion-chevron w-5 h-5 text-accent shrink-0"></i>
            </button>
            <div class="accordion-panel"><p class="px-6 pb-6 text-muted leading-relaxed" data-i18n="faq.a1"></p></div>
          </div>
          <div class="card">
            <button type="button" class="accordion-trigger w-full flex items-center justify-between gap-4 p-6 text-start font-extrabold text-navy" aria-expanded="false">
              <span data-i18n="faq.q2"></span><i data-lucide="chevron-down" class="accordion-chevron w-5 h-5 text-accent shrink-0"></i>
            </button>
            <div class="accordion-panel"><p class="px-6 pb-6 text-muted leading-relaxed" data-i18n="faq.a2"></p></div>
          </div>
          <div class="card">
            <button type="button" class="accordion-trigger w-full flex items-center justify-between gap-4 p-6 text-start font-extrabold text-navy" aria-expanded="false">
              <span data-i18n="faq.q3"></span><i data-lucide="chevron-down" class="accordion-chevron w-5 h-5 text-accent shrink-0"></i>
            </button>
            <div class="accordion-panel"><p class="px-6 pb-6 text-muted leading-relaxed" data-i18n="faq.a3"></p></div>
          </div>
          <div class="card">
            <button type="button" class="accordion-trigger w-full flex items-center justify-between gap-4 p-6 text-start font-extrabold text-navy" aria-expanded="false">
              <span data-i18n="faq.q4"></span><i data-lucide="chevron-down" class="accordion-chevron w-5 h-5 text-accent shrink-0"></i>
            </button>
            <div class="accordion-panel"><p class="px-6 pb-6 text-muted leading-relaxed" data-i18n="faq.a4"></p></div>
          </div>
          <div class="card">
            <button type="button" class="accordion-trigger w-full flex items-center justify-between gap-4 p-6 text-start font-extrabold text-navy" aria-expanded="false">
              <span data-i18n="faq.q5"></span><i data-lucide="chevron-down" class="accordion-chevron w-5 h-5 text-accent shrink-0"></i>
            </button>
            <div class="accordion-panel"><p class="px-6 pb-6 text-muted leading-relaxed" data-i18n="faq.a5"></p></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================================================
         CTA BAND
         ============================================================ -->
    <section class="relative overflow-hidden bg-gradient-to-l from-navy via-primary-700 to-primary text-white">
      <div class="relative max-w-content mx-auto px-4 sm:px-6 py-16 lg:py-20 text-center">
        <h2 class="text-2xl sm:text-3xl font-black mb-4" data-i18n="home.cta.title"></h2>
        <p class="text-gray-200 max-w-xl mx-auto mb-8" data-i18n="home.colors.subtitle"></p>
        <div class="flex flex-wrap gap-4 justify-center">
          <a href="#color-form" class="btn btn-accent"><i data-lucide="brush" class="w-5 h-5"></i><span data-i18n="cta.orderColorNow"></span></a>
          <a data-wa-link href="#" target="_blank" rel="noopener" class="btn btn-whatsapp"><i data-lucide="message-circle" class="w-5 h-5"></i><span data-i18n="cta.whatsapp"></span></a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer-mount"></div>
  <div id="floating-mount"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets/js/translations.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
