<body data-page="products"

  <div id="site-header-mount"></div>

    <!-- ============================================================

         ============================================================ -->
    <section class="relative overflow-hidden bg-gradient-to-bl from-navy to-primary text-white">
      <div class="absolute inset-0 pointer-events-none dot-grid" aria-hidden="true">
        <span class="pellet pellet-float absolute w-12 h-12 bg-accent/50 top-10 end-[12%]"></span>

         ============================================================ -->

          <div class="absolute inset-0 pointer-events-none dot-grid" aria-hidden="true">
            <span class="pellet pellet-float absolute w-10 h-10 bg-accent/50 top-6 start-[10%]"></span>
